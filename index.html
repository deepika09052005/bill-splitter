
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Splitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>💸 Bill Splitter</h1>
        <p class="subtitle">
            Split expenses easily with your friends!
        </p>

        <div class="form-group">
            <label for="bill">Total Bill Amount (₹)</label>
            <input type="number" id="bill"
                   placeholder="Enter total bill" min="0" step="0.01">
        </div>

        <div class="form-group">
            <label for="people">Number of People</label>
            <input type="number" id="people"
                   placeholder="Enter number of people" min="1" step="1">
        </div>

        <div class="form-group">
            <label for="tip">Tip Percentage (%)</label>
            <input type="number" id="tip"
                   placeholder="Enter tip percentage" value="0" min="0" step="0.01">
        </div>

        <button onclick="splitBill()">Split Bill</button>
        <button class="reset-btn" onclick="resetForm()">Reset</button>

        <p id="error" role="alert"></p>

        <div id="result" class="result" hidden>
            <h2>Bill Summary</h2>
            <p>Total Bill: <span id="totalBill"></span></p>
            <p>Tip Amount: <span id="tipAmount"></span></p>
            <p>Total with Tip: <span id="finalTotal"></span></p>
            <h3>Each Person Pays:</h3>
            <h2 id="perPerson"></h2>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
